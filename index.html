<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DerRedGuardian - Hub</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --panel-bg: rgba(20, 24, 35, 0.85);
            --panel-border: #1e2638;
            --accent-cyan: #00f0ff;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .hub-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hub-link {
            display: block;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.2);
            color: var(--text-main);
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .hub-link:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>

    <div class="hub-container">
        <h1>DerRedGuardian</h1>
        <p>Projekt-Übersicht & Dashboards</p>
        
        <div class="link-list">
            <a href="https://khi-drg-serverpc3.derredguardian.de/mainpage" class="hub-link">
                Trailmakers Grand Prix
            </a>
            <!-- Hier kannst du weitere Links einbauen -->
        </div>
    </div>

</body>
</html>
